version: '3.8'

services:
  # SkillBridge FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skillbridge-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - SECRET_KEY=replace-with-a-secure-random-32-byte-hex-key
      - DATABASE_URL=sqlite+aiosqlite:///./skillbridge.db
      # For Azure SQL:
      # - DATABASE_URL=mssql+aioodbc://<user>:<pass>@<server>.database.windows.net:1433/<db>?driver=ODBC+Driver+18+for+SQL+Server&Encrypt=yes&TrustServerCertificate=no
      # For Azure Blob Storage:
      # - AZURE_STORAGE_CONNECTION_STRING=<connection-string>
      # - AZURE_STORAGE_CONTAINER_NAME=skillbridge-uploads
      - CORS_ORIGINS=["http://localhost:3000","http://localhost:3001"]
    volumes:
      - backend-uploads:/app/uploads
      - backend-db:/app

  # Metabase Analytics Dashboard
  metabase:
    image: metabase/metabase:latest
    container_name: skillbridge-metabase
    ports:
      - "3001:3000"
    environment:
      - MB_DB_FILE=/metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data

volumes:
  backend-uploads:
  backend-db:
  metabase-data:

